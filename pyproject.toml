[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wwm-nav"
version = "0.1.0"
description = "Physics-conditioned RSSM/Dreamer navigation on outage-probability radio maps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.23",
  "torch>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/vicent-hang/WWM-NAV"
Issues = "https://github.com/vicent-hang/WWM-NAV/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.5",
]

[project.scripts]
wwm-nav-train = "scripts.train_wwm_nav:main"
wwm-nav-eval = "scripts.evaluate_wwm_nav:main"
wwm-nav-plot = "scripts.plot_trajectory:main"
wwm-nav-generate-map = "scripts.generate_sample_map:main"

[tool.setuptools.packages.find]
include = ["wwm_nav*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
